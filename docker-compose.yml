services:
  kafka:
    image: apache/kafka:3.7.0  # Switched to official Apache image
    container_name: kafka-server
    ports:
      - "9092:9092"
    environment:
      # Standard Kafka Environment Variables
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-server:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-server:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CLUSTER_ID=kraft-cluster-1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:15
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=events_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-service:
    build: .
    container_name: api-service
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sbt
      - "apiService/runMain api.Http4sServer"
    ports:
      - "9000:9000"

  processor-service:
    build: .
    container_name: processor-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - sbt
      - "processorService/runMain processor.EventProcessorApp"

  notification-service:
    build: .
    container_name: notification-service
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sbt
      - "notificationService/runMain notification.NotificationApp"

volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local